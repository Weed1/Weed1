<svg xmlns="http://www.w3.org/2000/svg" width="880" height="185" viewBox="0 0 880 185" role="img" aria-label="Main Quest: Network Operation Center at PT. Filltech Antar Nusa, since January 2025."><title>Main Quest: Network Operation Center at PT. Filltech Antar Nusa, since January 2025.</title><style>@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fu{animation:fadeUp .8s ease-out both}@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}.tw{animation:twinkle 3.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.8}}.pl{animation:pulse 4s ease-in-out infinite}@keyframes sweep{from{transform:translateX(-80px)}to{transform:translateX(280px)}}.sw{animation:sweep 2.8s ease-in-out infinite}@font-face{font-family:'LCinzel';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'LCinzel';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'LGaramond';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.5" y="0.5" width="879" height="184" rx="12" fill="#1f2a23" stroke="#5f9e6e"/><g class="fu" style="animation-delay:0.10s"><polygon points="39.00,40.00 37.24,44.57 32.34,44.84 36.15,47.93 34.89,52.66 39.00,50.00 43.11,52.66 41.85,47.93 45.66,44.84 40.76,44.57" fill="#5f9e6e"/><text x="52.0" y="52.0" font-family="LCinzel" font-weight="500" font-style="normal" font-size="12" fill="#5f9e6e" letter-spacing="2.9">MAIN QUEST</text><text x="32.0" y="94.0" font-family="LCinzel" font-weight="700" font-style="normal" font-size="28" fill="#eef0eb">Network Operation Center</text><text x="32.0" y="126.0" font-family="LGaramond" font-weight="400" font-style="normal" font-size="17" fill="#c3c8c1">Network Warden at PT. Filltech Antar Nusa. Watching network availability, resolving</text><text x="32.0" y="151.0" font-family="LGaramond" font-weight="400" font-style="normal" font-size="17" fill="#c3c8c1">incidents, and tending routers, switches, VLANs and BGP.</text></g><g class="fu" style="animation-delay:0.35s"><text x="648.0" y="60.0" font-family="LCinzel" font-weight="500" font-style="normal" font-size="11" fill="#9aa39b" letter-spacing="1.5">STATUS</text><defs><clipPath id="bar"><rect x="648" y="72" width="200" height="3" rx="1.5"/></clipPath><linearGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect x="648" y="72" width="200" height="3" rx="1.5" fill="#c9d4a0"/><g clip-path="url(#bar)"><rect class="sw" x="648" y="72" width="60" height="3" fill="url(#glow)"/></g><text x="648.0" y="102.0" font-family="LCinzel" font-weight="700" font-style="normal" font-size="15" fill="#c9d4a0" letter-spacing="1.8">ON THE ROAD</text><text x="648.0" y="126.0" font-family="LGaramond" font-weight="400" font-style="normal" font-size="15" fill="#9aa39b">January 2025 to present</text></g></svg>