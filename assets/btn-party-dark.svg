<svg xmlns="http://www.w3.org/2000/svg" width="161" height="44" viewBox="0 0 161 44" role="img" aria-label="Join My Party"><title>Join My Party</title><style>@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fu{animation:fadeUp .8s ease-out both}@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}.tw{animation:twinkle 3.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.8}}.pl{animation:pulse 4s ease-in-out infinite}@keyframes sweep{from{transform:translateX(-80px)}to{transform:translateX(280px)}}.sw{animation:sweep 2.8s ease-in-out infinite}@font-face{font-family:'LCinzel';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.5" y="0.5" width="160" height="43" rx="6" fill="#23362a" stroke="#5f9e6e"/><text x="22.0" y="27.0" font-family="LCinzel" font-weight="500" font-style="normal" font-size="13" fill="#e6e9e3" letter-spacing="1.3">JOIN MY PARTY</text></svg>