<svg xmlns="http://www.w3.org/2000/svg" width="157" height="44" viewBox="0 0 157 44" role="img" aria-label="Send A Raven"><title>Send A Raven</title><style>@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fu{animation:fadeUp .8s ease-out both}@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}.tw{animation:twinkle 3.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.8}}.pl{animation:pulse 4s ease-in-out infinite}@keyframes sweep{from{transform:translateX(-80px)}to{transform:translateX(280px)}}.sw{animation:sweep 2.8s ease-in-out infinite}@font-face{font-family:'LCinzel';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.5" y="0.5" width="156" height="43" rx="6" fill="#f4f6f2" stroke="#a9b3aa"/><text x="22.0" y="27.0" font-family="LCinzel" font-weight="500" font-style="normal" font-size="13" fill="#1f2622" letter-spacing="1.3">SEND A RAVEN</text></svg>